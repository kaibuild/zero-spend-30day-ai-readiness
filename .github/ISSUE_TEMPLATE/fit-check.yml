name: "60-second public fit check"
description: "Start with a public URL and non-confidential context. Do not include personal data or secrets."
title: "[Fit check] <pack> - <public URL/domain>"
body:
  - type: markdown
    attributes:
      value: |
        Use this only for public, non-confidential fit checks.

        Do not include personal names, email addresses, phone numbers, addresses, customer records, private support tickets, credentials, API keys, card details, bank details, contracts, or confidential material.

        This issue is not a completed order, payment, contract, invoice, or verified revenue record.

        Fast path:
        1. Open the public memo builder: https://kaibuild.github.io/zero-spend-30day-ai-readiness/memo-builder.html
        2. Paste only public, non-confidential context into this issue.
        3. If you are not sure which pack fits, use the self-serve fit check first: https://kaibuild.github.io/zero-spend-30day-ai-readiness/fit-check.html
  - type: dropdown
    id: pack
    attributes:
      label: Pack
      description: Choose one pack.
      options:
        - AI Search / LLM Visibility Revenue Path Pack
        - AI Support FAQ / Knowledge Base Pack
        - AI Workflow Automation Spec Pack
    validations:
      required: true
  - type: input
    id: public_url
    attributes:
      label: Public URL
      description: Public website, public help center, or public service page only.
      placeholder: "https://example.com/"
    validations:
      required: true
  - type: textarea
    id: non_confidential_goal
    attributes:
      label: Non-confidential goal
      description: Summarize the public, non-confidential problem and desired deliverable.
      placeholder: "Example: The public FAQ is sparse, comparison content is missing, and the team wants a 7-day implementation checklist. No customer data, private tickets, credentials, or secrets are included."
    validations:
      required: true
  - type: textarea
    id: current_public_material
    attributes:
      label: Current public material
      description: Optional. List public FAQ, help, pricing, comparison, or workflow pages that can be reviewed.
      placeholder: "- Public help URL: https://example.com/help\n- Pricing page: https://example.com/pricing\n- Comparison page: none yet"
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: "I understand the Standard pack is 200,000 JPY, and this checkbox is not payment, a contract, an invoice, or an order."
          required: true
        - label: "I did not include personal data, customer data, credentials, API keys, payment details, bank details, contracts, or confidential material."
          required: true
        - label: "I understand this issue is not a completed order, payment, invoice, contract, or verified revenue record."
          required: true
